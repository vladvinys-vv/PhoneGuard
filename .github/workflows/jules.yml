name: Jules configuration check

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Тесты и сборка живут в android-ci.yml — здесь только проверка конфигурации,
# чтобы не дублировать дорогие job'ы (раньше этот workflow глотал падения тестов
# через `|| echo`).
jobs:
  jules-config:
    name: Validate .jules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Config files exist
        run: |
          test -f .jules/config.json || { echo "::error::.jules/config.json отсутствует"; exit 1; }
          test -f .jules/rules.md || { echo "::error::.jules/rules.md отсутствует"; exit 1; }
          echo "Jules configuration validated."

      - name: config.json is valid JSON
        run: |
          python3 - <<'EOF'
          import json
          json.load(open('.jules/config.json', encoding='utf-8'))
          print('config.json is valid JSON')
          EOF
