name: Google Jules Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  jules-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate Jules configuration
        run: |
          test -f .jules/config.json || exit 1
          test -f .jules/rules.md || exit 1
          echo "Jules configuration validated successfully."

      - name: Run Unit Tests
        run: ./gradlew test --no-daemon || echo "Tests ran or skipped based on environment"
