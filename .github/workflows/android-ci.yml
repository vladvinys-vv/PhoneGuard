name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

# Отменяем устаревшие прогоны на той же ветке/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Быстрые проверки без Android SDK: ловят ошибки до тяжёлых job'ов.
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Пропущенная колонка в миграции Room = падение у обновляющихся пользователей,
      # а не просто красный тест, поэтому проверяем до всего остального.
      - name: Room migrations vs entities
        run: python3 tools/migration_check.py

      - name: Static audit (imports, R.*, Room, manifest, strings)
        run: python3 tools/static_audit.py

      # Числа в документации не должны расходиться с кодом.
      - name: Docs numbers match the code
        run: python3 tools/docs_check.py

      # Правила R8 против реального кода: слишком широкий `-keep` уже один раз отключил
      # обфускацию целиком. Проверка дешёвая и без Android SDK.
      - name: R8 rules vs code
        run: python3 tools/proguard_check.py

      - name: Strings are in sync with tools/sync_strings.py
        run: python3 tools/sync_strings.py --check

      # Строка без единой ссылки — не ошибка компилятора и не ошибка lint: она просто
      # сопровождается переводом неизвестно зачем.
      - name: No unused string resources
        run: python3 tools/unused_strings.py

      # Цвет, стиль или drawable без ссылок компилятор не замечает — они просто едут в APK.
      - name: No unused resources
        run: python3 tools/unused_resources.py

      # Путь или ссылка в документации, ведущие в никуда, ломают релизную инструкцию.
      - name: Docs links and paths exist
        run: python3 tools/docs_links.py

      # Долг перед MockK: файл с заглушками не выполняется в офлайн-прогоне, поэтому число
      # таких файлов под бюджетом, а не «как получится».
      - name: MockK budget
        run: python3 tools/mockk_audit.py

      # Правила ручного чек-листа (docs/MANUAL_TESTING.md, раздел 13) на синтетике.
      - name: Manual checklist rules
        run: python3 tools/manual_check.py --self-test

      # Подпись, R8, версия и mapping проверяются только релизной сборкой; связка между
      # CI и Gradle (куда пишется keystore, где ищется mapping) проверяется здесь.
      - name: Release path (signing, R8, mapping, 16 KB)
        run: python3 tools/release_check.py

      # Ошибки конфигурации Gradle (Kotlin-DSL в Groovy, версии плагинов, ext) валят
      # любую задачу ещё до компиляции — проверяем до тяжёлых job'ов.
      - name: Gradle scripts check
        run: python3 tools/gradle_check.py

  # Настоящий компилятор Kotlin без Android SDK: видит то, чего не видит regex-аудит.
  kotlin-frontend:
    name: Kotlin frontend check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Install Kotlin 2.1.0
        run: |
          curl -sSLo kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.1.0/kotlin-compiler-2.1.0.zip
          unzip -q kotlin.zip -d "$RUNNER_TEMP/kotlinc"
          echo "$RUNNER_TEMP/kotlinc/kotlinc/bin" >> "$GITHUB_PATH"

      # С android.jar в classpath проверяются ещё и реальные сигнатуры android.* API.
      - name: Compile all sources with the frontend
        run: python3 tools/kotlin_frontend_check.py

      # aapt2 (из build-tools) проверяет ресурсы и манифест — то же, что processDebugResources.
      # Платформа android-35 ставится шагом setup-android выше, поэтому здесь строгий режим:
      # если android.jar окажется старее compileSdk, это ошибка, а не тихий пропуск link.
      - name: Resources and manifest (aapt2)
        run: python3 tools/aapt2_check.py --require-compile-sdk

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [static-checks]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - run: ./gradlew lintProductionDebug --no-daemon --stacktrace

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [static-checks]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - run: ./gradlew testProductionDebugUnitTest --no-daemon --stacktrace
      # Gradle вернёт 0 и с зелёным отчётом, даже если тест-класс в прогон не попал.
      # Сверяем дерево тестов с JUnit-XML: молча не запустившиеся тесты — это не «зелено».
      - name: Test classes actually ran
        # --min-cases: сверка по классам не видит потерю кейсов внутри классов. Порог ниже
        # дерева тестов (сейчас 1085 @Test) — он не мешает добавлять тесты.
        run: python3 tools/junit_gate.py --require-report --min-cases 1000
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/**
          retention-days: 7

  build-debug:
    name: Build production debug APK
    runs-on: ubuntu-latest
    needs: [lint, unit-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - run: ./gradlew assembleProductionDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneGuard-production-debug
          path: app/build/outputs/apk/production/debug/*.apk
          retention-days: 30

  build-release:
    name: Build production release APK (unsigned)
    runs-on: ubuntu-latest
    needs: [lint, unit-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      # Keystore в этом job'е нет, а guard в `app/build.gradle` падает на любой задаче
      # `*Release` без подписи — иначе неподписанный APK уходил бы в артефакты молча.
      # Явный флаг: это проверочная сборка, а не публикационная (та — в Codemagic).
      - run: ./gradlew assembleProductionRelease -PallowUnsignedRelease=true --no-daemon --stacktrace
      - name: Verify 16 KB page alignment
        run: |
          APK="$(ls app/build/outputs/apk/production/release/*.apk 2>/dev/null | head -1)"
          ZIPALIGN="$(ls "$ANDROID_HOME"/build-tools/*/zipalign 2>/dev/null | sort -V | tail -1)"
          if [ -z "$APK" ] || [ ! -x "$ZIPALIGN" ]; then
            echo "zipalign/APK недоступны — проверка 16 КБ пропущена"
            exit 0
          fi
          echo "проверяю $APK"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK" | tail -5
      # Единственное место, где проверяются правила R8 на настоящем результате: `mapping.txt`
      # появляется только у релизной сборки. Тот же шаг есть в codemagic.yaml и build_release.sh.
      - name: Verify R8 obfuscation (mapping.txt)
        run: |
          MAPPING="$(ls app/build/outputs/mapping/*Release/mapping.txt 2>/dev/null | head -1)"
          if [ -z "$MAPPING" ]; then
            echo "mapping.txt не найден в app/build/outputs/mapping/*Release —"
            echo "обфускация не выполнялась (minifyEnabled?) или путь переопределён"
            exit 1
          fi
          python3 tools/proguard_check.py --mapping "$MAPPING"
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneGuard-production-release
          path: app/build/outputs/apk/production/release/*.apk
          retention-days: 30

  # Отправка статуса сборки на внешний webhook (docs/CI_WEBHOOKS.md).
  # Секреты WEBHOOK_URL / WEBHOOK_SECRET задаются в Settings → Secrets → Actions;
  # без них шаг просто печатает, что уведомление пропущено.
  notify:
    name: Webhook notification
    runs-on: ubuntu-latest
    needs: [static-checks, kotlin-frontend, lint, unit-test, build-debug, build-release]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Send build status
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BUILD_STATUS: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
        run: python3 tools/webhook_notify.py --status "$BUILD_STATUS"
