name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

# Отменяем устаревшие прогоны на той же ветке/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Быстрые проверки без Android SDK: ловят ошибки до тяжёлых job'ов.
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Static audit (imports, R.*, Room, manifest, strings, migrations)
        run: python3 tools/static_audit.py

      - name: Strings are in sync with tools/sync_strings.py
        run: |
          python3 tools/sync_strings.py
          if ! git diff --quiet -- app/src/main/res; then
            echo "::error::strings.xml не совпадает со словарём tools/sync_strings.py"
            git --no-pager diff --stat -- app/src/main/res
            exit 1
          fi

  # Настоящий компилятор Kotlin без Android SDK: видит то, чего не видит regex-аудит.
  kotlin-frontend:
    name: Kotlin frontend check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Kotlin 2.1.0
        run: |
          curl -sSLo kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.1.0/kotlin-compiler-2.1.0.zip
          unzip -q kotlin.zip -d "$RUNNER_TEMP/kotlinc"
          echo "$RUNNER_TEMP/kotlinc/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Compile all sources with the frontend
        run: python3 tools/kotlin_frontend_check.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [static-checks]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - run: ./gradlew lintDebug --no-daemon --stacktrace

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [static-checks]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest --no-daemon --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/**
          retention-days: 7

  build-debug:
    name: Build production debug APK
    runs-on: ubuntu-latest
    needs: [lint, unit-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - run: ./gradlew assembleProductionDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneGuard-production-debug
          path: app/build/outputs/apk/production/debug/*.apk
          retention-days: 30

  build-release:
    name: Build production release APK (unsigned)
    runs-on: ubuntu-latest
    needs: [lint, unit-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - run: ./gradlew assembleProductionRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneGuard-production-release
          path: app/build/outputs/apk/production/release/*.apk
          retention-days: 30
