plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
    id 'kotlin-parcelize'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// ВАЖНО: это Groovy DSL, а не Kotlin DSL. Здесь нет `mapOf(...)`, `listOf(...)` и прочих
// функций stdlib Kotlin — их вызов падает на этапе конфигурации с MissingMethodException
// (именно так ломался `./gradlew lintDebug`). Все свойства задаются через `=`.
android {
    namespace = 'com.phoneguard'
    compileSdk = 35

    def keystorePropertiesFile = rootProject.file("keystore.properties")
    def keystoreProperties = new Properties()
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }
    def releaseStorePath = keystoreProperties['storeFile'] ?: System.getenv("KEYSTORE_PATH")
    def hasReleaseKeystore = releaseStorePath != null && file(releaseStorePath).exists()

    defaultConfig {
        applicationId = "com.phoneguard"
        minSdk = 26
        targetSdk = 35
        versionCode = 1
        versionName = "1.0.0"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true

        // Room schema export location. `arguments` — живой MutableMap, поэтому put() работает
        // без сеттера (его может не быть в публичном API AGP). Главное — не `mapOf(...)`
        // из Kotlin stdlib: в Groovy такого метода нет (см. комментарий в начале файла).
        javaCompileOptions {
            annotationProcessorOptions {
                arguments.put("room.schemaLocation", projectDir.absolutePath + "/schemas")
            }
        }
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile = file(releaseStorePath)
                storePassword = keystoreProperties['storePassword'] ?: System.getenv("KEYSTORE_PASSWORD") ?: ""
                keyAlias = keystoreProperties['keyAlias'] ?: System.getenv("KEY_ALIAS") ?: ""
                keyPassword = keystoreProperties['keyPassword'] ?: System.getenv("KEY_PASSWORD") ?: ""
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig = signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix = ".debug"
        }
    }

    // У `flavorDimensions` нет сеттера в публичном API AGP — только метод с vararg.
    flavorDimensions "environment"
    productFlavors {
        staging {
            dimension = "environment"
            applicationIdSuffix = ".staging"
            versionNameSuffix = "-staging"
            manifestPlaceholders = [
                appLabel: "PhoneGuard Staging"
            ]
        }
        production {
            dimension = "environment"
            manifestPlaceholders = [
                appLabel: "PhoneGuard"
            ]
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    sourceSets {
        // Экспортированные схемы Room (app/schemas) нужны MigrationTestHelper, если тесты
        // миграций снова появятся. В репозитории схем пока нет — они создаются первой
        // сборкой, поэтому актуальную цепочку миграций проверяет JVM-тест
        // AppDatabaseMigrationConfigTest.
        // srcDir(), а не `srcDirs +=`: добавление на месте не зависит от наличия сеттера.
        androidTest.assets.srcDir("$projectDir/schemas")
    }

    packaging {
        resources {
            excludes.addAll([
                '/META-INF/{AL2.0,LGPL2.1}',
                '/META-INF/DEPENDENCIES',
                '/META-INF/LICENSE*',
                '/META-INF/NOTICE*',
            ])
        }
    }

    lint {
        // Локализация неполная умышленно: отсутствующие строки берутся из values/ (fallback).
        // addAll() вместо `disable +=`: мутация на месте не требует сеттера.
        disable.addAll(['MissingTranslation', 'UnusedResources'])
        abortOnError = true
        checkReleaseBuilds = true
    }

    testOptions {
        unitTests {
            // android.util.Log и прочие заглушки android.jar возвращают значения
            // по умолчанию вместо RuntimeException("Stub!").
            returnDefaultValues = true
            includeAndroidResources = true
        }
    }
}

dependencies {
    // Core Android
    implementation "androidx.core:core-ktx:$rootProject.ext.core_ktx_version"
    implementation "androidx.activity:activity-compose:$rootProject.ext.activity_version"
    implementation platform("androidx.compose:compose-bom:2024.12.01")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"  // версия из compose-bom
    implementation "androidx.compose.material:material-icons-extended"

    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$rootProject.ext.lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:$rootProject.ext.lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:$rootProject.ext.lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-service:$rootProject.ext.lifecycle_version"

    // Navigation
    implementation "androidx.navigation:navigation-compose:$rootProject.ext.navigation_version"
    implementation "androidx.hilt:hilt-navigation-compose:1.2.0"

    // Hilt
    implementation "com.google.dagger:hilt-android:$rootProject.ext.hilt_version"
    kapt "com.google.dagger:hilt-android-compiler:$rootProject.ext.hilt_version"

    // Room
    implementation "androidx.room:room-runtime:$rootProject.ext.room_version"
    implementation "androidx.room:room-ktx:$rootProject.ext.room_version"
    kapt "androidx.room:room-compiler:$rootProject.ext.room_version"
    // SQLCipher for Android (преемник закрытого android-database-sqlcipher): пакет
    // net.zetetic.database.sqlcipher, native-библиотеки собраны с
    // APP_SUPPORT_FLEXIBLE_PAGE_SIZES — требование Play к 16 КБ страницам при targetSdk 35.
    //
    // Версия 4.16.0 — последняя, собранная с compileSdk 34. Начиная с 4.19 библиотека собрана
    // с compileSdk 36, и её AAR-metadata требует от потребителя compileSdk ≥ 36, иначе
    // CheckAarMetadataTask валит сборку («requires ... compile against version 36 or later»).
    // Поднимать до 4.19+ можно только вместе с AGP ≥ 8.9.1, Gradle ≥ 8.11.1 и compileSdk 36.
    // androidx.sqlite — compile-зависимость библиотеки (для 4.16.0 это 2.6.2).
    implementation "net.zetetic:sqlcipher-android:4.16.0"
    implementation "androidx.sqlite:sqlite:2.6.2"

    // JSON serialization for scan reports
    implementation "com.google.code.gson:gson:2.11.0"

    // Phone number parsing / E.164 normalisation (google/libphonenumber)
    implementation "com.googlecode.libphonenumber:libphonenumber:$rootProject.ext.libphonenumber_version"

    // HTTP client with certificate-pinning support (square/okhttp)
    implementation platform("com.squareup.okhttp3:okhttp-bom:$rootProject.ext.okhttp_version")
    implementation "com.squareup.okhttp3:okhttp"
    implementation "com.squareup.okhttp3:logging-interceptor"

    // APK / certificate inspection for the malware scanner (hsiafan/apk-parser)
    implementation "net.dongliu:apk-parser:$rootProject.ext.apk_parser_version"

    // WorkManager
    implementation "androidx.work:work-runtime-ktx:$rootProject.ext.work_version"
    implementation "androidx.hilt:hilt-work:1.1.0"
    kapt "androidx.hilt:hilt-compiler:1.1.0"

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$rootProject.ext.coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$rootProject.ext.coroutines_version"

    // DataStore
    implementation "androidx.datastore:datastore-preferences:1.0.0"

    // Jetpack Security (for Secure Vault)
    implementation "androidx.security:security-crypto:1.1.0"

    // Biometrics (for Secure Vault unlock)
    implementation "androidx.biometric:biometric:1.1.0"

    // CameraX (for anti-theft photos)
    def camerax_version = "1.4.1"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"

    // Google Play Services Location (for Fused Location)
    implementation "com.google.android.gms:play-services-location:21.3.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:$rootProject.ext.coroutines_version"

    // ML Kit Face Detection (for shoulder surfer detection)
    implementation "com.google.android.gms:play-services-mlkit-face-detection:17.1.0"

    // Testing
    testImplementation "junit:junit:$rootProject.ext.junit_version"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:$rootProject.ext.espresso_version"
    androidTestImplementation "androidx.room:room-testing:$rootProject.ext.room_version"
    androidTestImplementation platform("androidx.compose:compose-bom:2024.12.01")
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
    debugImplementation "com.squareup.leakcanary:leakcanary-android:2.14"

    // Mocking
    testImplementation "io.mockk:mockk:$rootProject.ext.mockk_version"
    androidTestImplementation "io.mockk:mockk-android:$rootProject.ext.mockk_version"
    androidTestImplementation "androidx.test:core-ktx:1.6.1"
    androidTestImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$rootProject.ext.coroutines_version"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$rootProject.ext.coroutines_version"
    testImplementation "app.cash.turbine:turbine:1.2.0"
    testImplementation "org.robolectric:robolectric:$rootProject.ext.roboversion"
    testImplementation "com.squareup.okhttp3:mockwebserver"
}

kapt {
    correctErrorTypes = true
}
