plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
    id 'kotlin-parcelize'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.firebase.crashlytics'
}

android {
    namespace 'com.phoneguard'
    compileSdk 35

    defaultConfig {
        applicationId "com.phoneguard"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        // Room schema export location
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += mapOf("room.schemaLocation" to "$projectDir/schemas".toString())
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    signingConfigs {
        release {
            // Signing config should be provided via environment variables or local.properties
            // storeFile file(System.getenv("KEYSTORE_PATH") ?: "keystore.jks")
            // storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
            // keyAlias System.getenv("KEY_ALIAS") ?: ""
            // keyPassword System.getenv("KEY_PASSWORD") ?: ""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // Core Android
    implementation "androidx.core:core-ktx:$rootProject.ext.core_ktx_version"
    implementation "androidx.activity:activity-compose:$rootProject.ext.activity_version"
    implementation platform("androidx.compose:compose-bom:2024.12.01")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3:$rootProject.ext.material3_version"
    implementation "androidx.compose.material:material-icons-extended"
    
    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$rootProject.ext.lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:$rootProject.ext.lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:$rootProject.ext.lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-service:$rootProject.ext.lifecycle_version"

    // Navigation
    implementation "androidx.navigation:navigation-compose:$rootProject.ext.navigation_version"
    implementation "androidx.hilt:hilt-navigation-compose:1.2.0"
    
    // Hilt
    implementation "com.google.dagger:hilt-android:$rootProject.ext.hilt_version"
    kapt "com.google.dagger:hilt-android-compiler:$rootProject.ext.hilt_version"
    
    // Room
    implementation "androidx.room:room-runtime:$rootProject.ext.room_version"
    implementation "androidx.room:room-ktx:$rootProject.ext.room_version"
    kapt "androidx.room:room-compiler:$rootProject.ext.room_version"
    implementation "net.zetetic:android-database-sqlcipher:4.5.4"
    kapt "net.zetetic:android-database-sqlcipher-javadoc:4.5.4"
    // Force newer kotlinx-metadata-jvm for Room kapt compatibility with Kotlin 2.1
    kapt "org.jetbrains.kotlinx:kotlinx-metadata-jvm:0.7.0"
    
    // WorkManager
    implementation "androidx.work:work-runtime-ktx:$rootProject.ext.work_version"
    implementation "androidx.hilt:hilt-work:1.1.0"
    kapt "androidx.hilt:hilt-compiler:1.1.0"
    
    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$rootProject.ext.coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$rootProject.ext.coroutines_version"
    
    // DataStore
    implementation "androidx.datastore:datastore-preferences:1.0.0"

    // Jetpack Security (for Secure Vault)
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // Biometrics (for Secure Vault unlock)
    implementation "androidx.biometric:biometric:1.2.0-alpha05"

    // CameraX (for anti-theft photos)
    def camerax_version = "1.4.1"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"

    // Google Play Services Location (for Fused Location)
    implementation "com.google.android.gms:play-services-location:21.3.0"

    // ML Kit Face Detection (for shoulder surfer detection)
    implementation "com.google.android.gms:play-services-mlkit-face-detection:17.1.0"

    // Firebase Crashlytics
    implementation platform("com.google.firebase:firebase-bom:33.1.0")
    implementation "com.google.firebase:firebase-crashlytics"
    implementation "com.google.firebase:firebase-analytics"

    // Testing
    testImplementation "junit:junit:$rootProject.ext.junit_version"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:$rootProject.ext.espresso_version"
    androidTestImplementation platform("androidx.compose:compose-bom:2024.12.01")
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
    
    // Mocking
    testImplementation "io.mockk:mockk:$rootProject.ext.mockk_version"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$rootProject.ext.coroutines_version"
    testImplementation "app.cash.turbine:turbine:1.2.0"
    testImplementation "org.robolectric:robolectric:$rootProject.ext.roboversion"
}

kapt {
    correctErrorTypes true
}