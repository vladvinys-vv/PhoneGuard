workflows:
  phoneguard-android:
    name: PhoneGuard Android
    max_build_duration: 120

    environment:
      java: 17
      vars:
        # Секреты webhook'а (docs/CI_WEBHOOKS.md) задаются в Codemagic UI →
        # Environment variables как WEBHOOK_URL и WEBHOOK_SECRET; без них шаг
        # просто печатает, что уведомление пропущено.
        WEBHOOK_TIMEOUT: "10"
        WEBHOOK_RETRIES: "3"

    # Автоматические сборки: webhook репозитория → https://api.codemagic.io/hooks/<appId>
    # (Codemagic UI: App settings → Webhooks → Create webhook).
    triggering:
      events:
        - push
        - pull_request
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: master
          include: true
          source: true
        - pattern: develop
          include: true
          source: true
      tag_patterns:
        - pattern: "v*"
          include: true
      cancel_previous_builds: true

    scripts:
      - name: Make Gradle wrapper executable
        script: chmod +x ./gradlew
      - name: Static audit
        script: python3 tools/static_audit.py
      - name: Strings are in sync
        script: python3 tools/sync_strings.py --check
      - name: Kotlin frontend check
        script: |
          if command -v kotlinc >/dev/null 2>&1; then
            python3 tools/kotlin_frontend_check.py
          else
            echo "kotlinc не установлен — компиляторная проверка пропущена"
          fi
      - name: Resources and manifest (aapt2)
        script: |
          if [ -x "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt2" ]; then
            python3 tools/aapt2_check.py
          else
            echo "aapt2 не найден — проверка ресурсов пропущена"
          fi
      - name: Lint
        script: ./gradlew lintDebug --no-daemon --stacktrace
      - name: Unit tests
        script: ./gradlew testDebugUnitTest --no-daemon --stacktrace
      - name: Build production debug APK
        script: ./gradlew assembleProductionDebug --no-daemon --stacktrace
      - name: Build production release APK
        script: ./gradlew assembleProductionRelease --no-daemon --stacktrace
      # Ставится только если все шаги выше прошли: publishing-скрипты Codemagic
      # выполняются и при падении, поэтому статус для webhook'а берётся из маркера.
      - name: Mark build successful
        script: python3 tools/webhook_notify.py --mark-success

    artifacts:
      - app/build/outputs/**/*.apk
      - app/build/outputs/**/*.aab
      - app/build/reports/lint-results-debug.html
      - app/build/reports/tests/**

    publishing:
      scripts:
        - name: Send build status to webhook
          script: python3 tools/webhook_notify.py
