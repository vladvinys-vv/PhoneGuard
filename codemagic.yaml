workflows:
  phoneguard-android:
    name: PhoneGuard Android
    max_build_duration: 120

    environment:
      java: 17
      vars:
        # Секреты webhook'а (docs/CI_WEBHOOKS.md) задаются в Codemagic UI →
        # Environment variables как WEBHOOK_URL и WEBHOOK_SECRET; без них шаг
        # просто печатает, что уведомление пропущено.
        WEBHOOK_TIMEOUT: "10"
        WEBHOOK_RETRIES: "3"

    # Кэш Gradle: повторные сборки не перекачивают зависимости заново.
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper

    # Автоматические сборки: webhook репозитория → https://api.codemagic.io/hooks/<appId>
    # (Codemagic UI: App settings → Webhooks → Create webhook).
    triggering:
      events:
        - push
        - pull_request
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: master
          include: true
          source: true
        - pattern: develop
          include: true
          source: true
      tag_patterns:
        - pattern: "v*"
          include: true
      cancel_previous_builds: true

    scripts:
      - name: Make Gradle wrapper executable
        script: chmod +x ./gradlew
      - name: Gradle scripts check
        script: python3 tools/gradle_check.py
      - name: R8 rules check
        script: python3 tools/proguard_check.py
      - name: Room migrations check
        script: python3 tools/migration_check.py
      - name: Static audit
        script: python3 tools/static_audit.py
      - name: Docs numbers check
        script: python3 tools/docs_check.py
      - name: Strings are in sync
        script: python3 tools/sync_strings.py --check
      - name: No unused string resources
        script: python3 tools/unused_strings.py
      - name: No unused resources
        script: python3 tools/unused_resources.py
      - name: Docs links and paths exist
        script: python3 tools/docs_links.py
      - name: Hilt dependency graph
        script: python3 tools/hilt_check.py
      - name: MockK budget
        script: python3 tools/mockk_audit.py
      - name: Manual checklist rules
        script: python3 tools/manual_check.py --self-test
      - name: Release path (signing, R8, mapping, 16 KB)
        script: python3 tools/release_check.py
      - name: Kotlin frontend check
        script: |
          if command -v kotlinc >/dev/null 2>&1; then
            python3 tools/kotlin_frontend_check.py
          else
            echo "kotlinc не установлен — компиляторная проверка пропущена"
          fi
      # На образах Codemagic может не быть android-35: ставим платформу явно, иначе
      # манифест линкуется против старого android.jar (ложная ошибка про specialUse).
      - name: Ensure Android SDK platform 35
        script: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" >/dev/null || \
              echo "sdkmanager: не удалось обновить платформу — aapt2_check сам решит, что проверять"
          else
            echo "sdkmanager не найден — оставляем платформы как есть"
          fi
      - name: Resources and manifest (aapt2)
        script: python3 tools/aapt2_check.py
      # Keystore приходит из секретов Codemagic (KEYSTORE_BASE64, KEYSTORE_PASSWORD,
      # KEY_ALIAS, KEY_PASSWORD). Без него релизная сборка теперь падает на guard'е в
      # app/build.gradle — молча собрать неподписанный APK больше нельзя.
      - name: Materialise release keystore
        script: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "KEYSTORE_BASE64 не задан — релизная сборка пойдёт как проверочная (без подписи)"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$CM_BUILD_DIR/app/release.keystore"
          {
            echo "storeFile=release.keystore"
            echo "storePassword=${KEYSTORE_PASSWORD:-}"
            echo "keyAlias=${KEY_ALIAS:-}"
            echo "keyPassword=${KEY_PASSWORD:-}"
          } > "$CM_BUILD_DIR/keystore.properties"
          echo "keystore готов: $CM_BUILD_DIR/app/release.keystore"

      - name: Lint
        script: ./gradlew lintProductionDebug --no-daemon --stacktrace
      - name: Unit tests
        script: ./gradlew testProductionDebugUnitTest --no-daemon --stacktrace
      - name: Test classes actually ran
        script: python3 tools/junit_gate.py --require-report --min-cases 1000
      - name: Build production debug APK
        script: ./gradlew assembleProductionDebug --no-daemon --stacktrace
      # versionCode/versionName: из тега `v1.2.3` → code 10203, иначе — build number.
      # Зашитая в build.gradle единица давала одинаковый versionCode у разных релизов,
      # а такой APK/AAB Play не принимает.
      - name: Build production release APK and bundle
        script: |
          VERSION_NAME=""
          VERSION_CODE=""
          if [ -n "${CM_TAG:-}" ]; then
            case "$CM_TAG" in
              v[0-9]*.[0-9]*.[0-9]*) ;;
              *)
                echo "Тег ${CM_TAG} не в формате vMAJOR.MINOR.PATCH — версию определить нельзя"
                exit 1
                ;;
            esac
            VERSION_NAME="${CM_TAG#v}"
            MAJOR="$(echo "$VERSION_NAME" | cut -d. -f1)"
            MINOR="$(echo "$VERSION_NAME" | cut -d. -f2)"
            PATCH="$(echo "$VERSION_NAME" | cut -d. -f3)"
            VERSION_CODE="$((MAJOR * 10000 + MINOR * 100 + PATCH))"
          else
            VERSION_CODE="${BUILD_NUMBER:-1}"
            VERSION_NAME="0.0.${VERSION_CODE}"
          fi
          echo "сборка версии ${VERSION_NAME} (versionCode ${VERSION_CODE})"

          UNSIGNED=""
          if [ ! -f "$CM_BUILD_DIR/keystore.properties" ]; then
            # Тег — публикационный сбор: без подписи он не имеет смысла.
            case "${CM_TAG:-}" in
              v*)
                echo "Тег ${CM_TAG}, а keystore нет — публикационная сборка без подписи невозможна"
                exit 1
                ;;
            esac
            UNSIGNED="-PallowUnsignedRelease=true"
            echo "ВНИМАНИЕ: keystore нет — APK/AAB будут неподписанными (только для проверки)"
          fi
          ./gradlew assembleProductionRelease bundleProductionRelease \
            -PpgVersionCode="$VERSION_CODE" -PpgVersionName="$VERSION_NAME" \
            $UNSIGNED --no-daemon --stacktrace
      # Правила R8 проверяются только релизной сборкой: в песочнице нет ни Gradle, ни R8.
      # Слишком широкий `-keep` уже один раз отключил обфускацию целиком, и заметить это
      # было нечем: релиз отличался от debug размером, а не защитой.
      - name: Verify R8 obfuscation (mapping.txt)
        script: |
          # Путь по умолчанию — app/build/outputs/mapping/productionRelease/mapping.txt,
          # но `mappingFile` можно переопределить, поэтому берём найденный Release-маппинг.
          MAPPING="$(ls app/build/outputs/mapping/*Release/mapping.txt 2>/dev/null | head -1)"
          if [ -z "$MAPPING" ]; then
            echo "mapping.txt не найден в app/build/outputs/mapping/*Release —"
            echo "обфускация не выполнялась (minifyEnabled?) или путь переопределён"
            exit 1
          fi
          python3 tools/proguard_check.py --mapping "$MAPPING"
      # Play с 01.11.2025 требует 16 КБ страницы памяти для targetSdk 35 — проверяем фактический APK.
      - name: Verify 16 KB page alignment
        script: |
          APK="$(ls app/build/outputs/apk/production/release/*.apk 2>/dev/null | head -1)"
          ZIPALIGN="$(ls "$ANDROID_HOME"/build-tools/*/zipalign 2>/dev/null | sort -V | tail -1)"
          if [ -z "$APK" ] || [ ! -x "$ZIPALIGN" ]; then
            echo "zipalign/APK недоступны — проверка 16 КБ пропущена"
            exit 0
          fi
          echo "проверяю $APK"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK" | tail -5
      # Ставится только если все шаги выше прошли: publishing-скрипты Codemagic
      # выполняются и при падении, поэтому статус для webhook'а берётся из маркера.
      - name: Mark build successful
        script: python3 tools/webhook_notify.py --mark-success

    artifacts:
      - app/build/outputs/**/*.apk
      - app/build/outputs/**/*.aab
      # mapping.txt нужен, чтобы разобрать стек-трейс из релизной сборки.
      - app/build/outputs/mapping/**
      - app/build/reports/lint-results-debug.html
      - app/build/reports/tests/**

    publishing:
      scripts:
        - name: Send build status to webhook
          script: python3 tools/webhook_notify.py
