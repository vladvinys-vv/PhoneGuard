stages:
  - static
  - test
  - build

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  # SDK ставится в кэшируемый каталог проекта: без него AGP падает на конфигурации
  # («SDK location not found»), и job не доходит даже до компиляции.
  ANDROID_HOME: "$CI_PROJECT_DIR/.android-sdk"
  ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/.android-sdk"
  ANDROID_CMDLINE_TOOLS: "commandlinetools-linux-11076708_latest"

cache:
  key:
    files:
      - gradle/wrapper/gradle-wrapper.properties
      - app/build.gradle
  paths:
    - .gradle/wrapper
    - .gradle/caches
    - .android-sdk

# Static checks need neither Android SDK nor network: the cheapest "no" for a bad commit.
# Набор тот же, что в .github/workflows/android-ci.yml и codemagic.yaml — расхождения ловит
# tools/ci_check.py.
static-checks:
  stage: static
  image: python:3.11
  script:
    - python3 tools/gradle_check.py
    - python3 tools/proguard_check.py
    - python3 tools/migration_check.py
    - python3 tools/static_audit.py
    - python3 tools/docs_check.py
    - python3 tools/sync_strings.py --check
    - python3 tools/unused_strings.py
    - python3 tools/unused_resources.py
    - python3 tools/docs_links.py
    - python3 tools/power_audit.py
    - python3 tools/hilt_check.py
    - python3 tools/mockk_audit.py
    - python3 tools/manual_check.py --self-test
    - python3 tools/release_check.py

.android:
  image: eclipse-temurin:17-jdk
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq curl unzip > /dev/null
    - chmod +x ./gradlew
    - |
      if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
        mkdir -p "$ANDROID_HOME/cmdline-tools"
        curl -sSL -o /tmp/cmdline-tools.zip \
          "https://dl.google.com/android/repository/${ANDROID_CMDLINE_TOOLS}.zip"
        unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
        mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
      fi
    - yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
    - >
      "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
      "platforms;android-35" "build-tools;35.0.0" > /dev/null

unit-test:
  extends: .android
  stage: test
  script:
    - ./gradlew testProductionDebugUnitTest --no-daemon --stacktrace
    # --min-cases: сверка по классам не видит потерю кейсов внутри классов.
    - python3 tools/junit_gate.py --require-report --min-cases 1000
    # Порог выполняемого покрытия: тест на MockK/Robolectric офлайн не исполняется.
    - python3 tools/test_coverage_map.py --min-executed 152
    # Ресурсы и манифест тем же aapt2, которым их обрабатывает AGP: платформа и build-tools
    # уже стоят в .android, поэтому проверка не пропускается, а действительно выполняется.
    - python3 tools/aapt2_check.py
  artifacts:
    when: always
    name: "phoneguard-unit-tests-$CI_COMMIT_SHORT_SHA"
    expire_in: 7 days
    paths:
      - app/build/reports/tests/

lint:
  extends: .android
  stage: test
  script:
    # abortOnError = true в app/build.gradle: lint здесь — такая же проверка, как тесты.
    # До этого GitLab был единственным CI с Android SDK, который не запускал ни lint, ни aapt2.
    - ./gradlew lintProductionDebug --no-daemon --stacktrace
  artifacts:
    when: always
    name: "phoneguard-lint-$CI_COMMIT_SHORT_SHA"
    expire_in: 7 days
    paths:
      - app/build/reports/lint-results-debug.html

build-debug:
  extends: .android
  stage: build
  needs: [unit-test]
  script:
    - ./gradlew assembleProductionDebug --no-daemon --stacktrace
  artifacts:
    name: "phoneguard-debug-$CI_COMMIT_SHORT_SHA"
    expire_in: 7 days
    paths:
      - app/build/outputs/apk/production/debug/
