buildscript {
    ext {
        compose_version = '1.7.6'
        hilt_version = '2.55'
        room_version = '2.7.2'
        work_version = '2.10.0'
        coroutines_version = '1.10.1'
        navigation_version = '2.8.5'
        lifecycle_version = '2.8.7'
        activity_version = '1.10.0'
        core_ktx_version = '1.15.0'
        junit_version = '4.13.2'
        espresso_version = '3.6.1'
        mockk_version = '1.13.16'
        roboversion = '4.14.1'
        libphonenumber_version = '9.0.42'
        okhttp_version = '4.12.0'
        apk_parser_version = '2.6.10'
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.5.2"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0"
        classpath "com.google.dagger:hilt-android-gradle-plugin:$hilt_version"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.1.0"
    }
}

tasks.register("clean", Delete) {
    // buildDir устарел в Gradle 8 (удаляется в 9) — используем ленивый layout.
    delete rootProject.layout.buildDirectory
}